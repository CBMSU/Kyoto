name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw -B verify
